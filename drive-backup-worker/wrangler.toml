name = "kawal-spip-drive-backup"
main = "index.js"
compatibility_date = "2026-09-10"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kawal-spip-db"
database_id = "46bfc2a4-e13a-40b7-b21d-89642702a3a8"

[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "kawal-spip-files"

[[queues.consumers]]
queue = "kawal-spip-drive-backup"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 100
dead_letter_queue = "kawal-spip-drive-backup-dlq"
max_concurrency = 3

[[queues.producers]]
binding = "DRIVE_BACKUP_QUEUE"
queue = "kawal-spip-drive-backup"

[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"
script_name = "kawal-spip-realtime"
