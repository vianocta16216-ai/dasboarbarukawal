name = "kawal-spip"
compatibility_date = "2026-09-11"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "kawal-spip"
database_id = "REPLACE_WITH_EXISTING_D1_DATABASE_ID"

[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "REPLACE_WITH_EXISTING_R2_BUCKET_NAME"

[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]
